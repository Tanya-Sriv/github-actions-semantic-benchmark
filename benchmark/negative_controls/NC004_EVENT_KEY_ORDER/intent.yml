schema_version: "0.1"
baseline_id: B004
intent_version: "1.0"
description: Validation runs for pull requests and pushes to main when source, tests, or project configuration changes.
scope:
  platform: github-actions
  workflow_files:
    - .github/workflows/ci.yml
  repository_fixture: fixture
expectations:
  required_events: [pull_request, push]
  required_branches:
    pull_request: [main]
    push: [main]
  required_paths:
    pull_request: ["src/**", "tests/**", "pyproject.toml"]
    push: ["src/**", "tests/**", "pyproject.toml"]
  required_jobs: [validate]
  timeouts:
    - job: validate
      required: true
      maximum_minutes: 15
notes:
  - Trigger completeness is defined by this baseline intent.
