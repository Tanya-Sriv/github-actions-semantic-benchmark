name: failure-handling-baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r fixture/requirements.txt
      - id: run-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python -m pytest -q fixture 2>&1 | tee logs/test-output.txt
      - id: upload-failure-logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: "failure-logs"
          path: logs/

  summarize:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "test conclusion=${{ needs.test.result }}"'
