name: concurrency-ci-baseline
on:
  pull_request:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: global
  cancel-in-progress: !!bool 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - run: echo "ci"
