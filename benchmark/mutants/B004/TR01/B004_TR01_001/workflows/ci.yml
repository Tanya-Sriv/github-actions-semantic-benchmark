name: trigger-intent-baseline
on:
  push:
    branches:
    - main
    paths:
    - src/**
    - tests/**
    - pyproject.toml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: python -m pip install -e fixture
    - name: Run tests
      working-directory: fixture
      run: python -m pytest -q
