schema_version: '0.1'
mutant_id: B003_RL02_001
baseline_id: B003
operator_id: RL02
oracle_strength: O3
fault_class: failure_handling
expected_fault: Making the test step non-blocking may alter failure-status propagation so the required failure()-guarded log
  upload no longer executes.
preconditions:
- id: P1
  description: run-tests is the failure source.
  verification: static_check
- id: P2
  description: upload-failure-logs uses failure().
  verification: static_check
- id: P3
  description: The intent manifest requires failure logs.
  verification: manual_review
mutation:
  target_file: .github/workflows/ci.yml
  target_path: jobs.test.steps[id=run-tests].continue-on-error
  before: null
  after: !!bool 'true'
  single_fault_expected: !!bool 'true'
  mutant_sha256: dc01c66d21a87921ac6284514e997a49f117978abf949b0e5a8530164c389bc8
ground_truth:
  basis:
  - type: intent_manifest
    reference: B003 required_failure_handlers artifact entry
  - type: objective_relation
    reference: Status propagation from run-tests to failure()-guarded step
  violated_property: Failure-handling behavior must preserve the declared requirement that test failures produce diagnostic
    artifacts.
  expected_behavior: Under the controlled failing fixture, the mutation may convert the failed step's final conclusion to
    success and suppress the subsequent failure()-guarded upload step; this behavior must be confirmed experimentally.
  execution_confirmation_required: !!bool 'true'
  execution_confirmation_status: confirmed
detection_criteria:
  counts_as_detection:
  - Diagnostic identifies that continue-on-error can interfere with the required failure-log handler.
  - Diagnostic identifies that the failure()-guarded upload may become unreachable after failure masking.
  does_not_count_as_detection:
  - A warning only that continue-on-error is present.
  - A warning only that failure() is used.
  acceptable_equivalent_diagnostics:
  - Failure masking may suppress required failure-log collection.
expected_tool_behavior:
  actionlint:
    expectation: likely_miss
    basis: reasoned_expectation
    notes: No documented rule specifically covers this declared or cross-element operational relation.
  zizmor:
    expectation: likely_miss
    basis: reasoned_expectation
    notes: Security-focused analysis is not expected to identify this non-security operational relation.
  poutine:
    expectation: likely_miss
    basis: reasoned_expectation
    notes: Built-in security rules are not expected to identify this non-security operational relation.
  semantic_checker:
    expectation: detect
    basis: reasoned_expectation
    notes: Perform cross-step status propagation and handler reachability analysis.
manual_review:
  required: !!bool 'true'
  review_status: completed
  review_notes: Controlled execution confirmed failure masking and suppression of the failure-gated artifact.
limitations:
- GitHub distinguishes step outcome from conclusion; the exact failure() interaction must be established by controlled execution.
- Until execution is completed, this oracle states a testable risk rather than a confirmed platform behavior.
