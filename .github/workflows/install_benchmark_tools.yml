name: Install and verify benchmark tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSfL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz

          tar -xzf actionlint.tar.gz
          sudo install actionlint /usr/local/bin/actionlint

      - name: Install zizmor
        run: |
          python -m pip install --disable-pip-version-check \
            "zizmor==1.28.0"

      - name: Install poutine
        run: |
          curl -sSfL \
            https://github.com/boostsecurityio/poutine/releases/download/v1.1.4/poutine_Linux_x86_64.tar.gz \
            -o poutine.tar.gz

          tar -xzf poutine.tar.gz
          sudo install poutine /usr/local/bin/poutine

      - name: Verify installations
        run: |
          echo "actionlint:"
          actionlint -version

          echo "zizmor:"
          zizmor --version

          echo "poutine:"
          poutine version
