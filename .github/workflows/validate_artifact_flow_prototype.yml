name: Validate Artifact-Flow Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prototype/artifact_flow_v0.2/**"
      - "prototype/history/holdout1/**"
      - "benchmark/**"
      - ".github/workflows/validate_artifact_flow_prototype.yml"
  pull_request:
    paths:
      - "prototype/artifact_flow_v0.2/**"
      - "prototype/history/holdout1/**"
      - "benchmark/**"
      - ".github/workflows/validate_artifact_flow_prototype.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r prototype/artifact_flow_v0.2/requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest prototype/artifact_flow_v0.2/tests -q

      - name: Evaluate benchmark corpus
        run: |
          python prototype/artifact_flow_v0.2/evaluation/run_evaluation.py \
            --baselines benchmark/baselines \
            --mutants benchmark/mutants \
            --manifest benchmark/mutant_manifest.csv \
            --controls benchmark/negative_controls \
            --output-dir prototype/artifact_flow_v0.2/evaluation/results

      - name: Upload evaluation results
        uses: actions/upload-artifact@v6
        with:
          name: artifact-flow-prototype-v0.2-results
          path: prototype/artifact_flow_v0.2/evaluation/results/
          if-no-files-found: error