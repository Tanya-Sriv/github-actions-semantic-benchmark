name: CE11 baseline release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record start time
        run: date -u +"%Y-%m-%dT%H:%M:%SZ"
      - name: Hold workflow for overlap
        run: sleep 90
      - name: Record end time
        if: ${{ always() }}
        run: date -u +"%Y-%m-%dT%H:%M:%SZ"
