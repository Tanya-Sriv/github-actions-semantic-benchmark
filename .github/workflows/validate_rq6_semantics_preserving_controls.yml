name: Validate RQ6 semantics-preserving controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-negative-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "zizmor==1.28.0"

          curl -sSfL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz
          sudo install actionlint /usr/local/bin/actionlint

          curl -sSfL \
            https://github.com/boostsecurityio/poutine/releases/download/v1.1.4/poutine_Linux_x86_64.tar.gz \
            -o poutine.tar.gz
          tar -xzf poutine.tar.gz
          sudo install poutine /usr/local/bin/poutine

          actionlint -version
          zizmor --version
          poutine version

      - name: Validate semantic equivalence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_semantic_equivalence.py

      - name: Scan source baselines and controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NO_COLOR: "1"
          TERM: dumb
        run: |
          set -euo pipefail
          mkdir -p results/raw

          scan_one() {
            local case_id="$1"
            local case_dir="$2"
            local out="results/raw/${case_id}"
            mkdir -p "$out"

            mapfile -t files < <(
              find "$case_dir/workflows" \
                -maxdepth 1 -type f \
                \( -name "*.yml" -o -name "*.yaml" \) |
              sort
            )

            printf '%s\n' "${files[@]}" > "$out/input-files.txt"

            set +e
            actionlint -format '{{json .}}' "${files[@]}" \
              > "$out/actionlint.json" \
              2> "$out/actionlint.stderr.txt"
            echo $? > "$out/actionlint.exit-code.txt"

            zizmor --format json --no-exit-codes "${files[@]}" \
              > "$out/zizmor.json" \
              2> "$out/zizmor.stderr.txt"
            echo $? > "$out/zizmor.exit-code.txt"

            poutine analyze_local "$case_dir" --format json \
              > "$out/poutine.json" \
              2> "$out/poutine.stderr.txt"
            echo $? > "$out/poutine.exit-code.txt"
            set -e
          }

          scan_one B001 benchmark/baselines/B001
          scan_one B002 benchmark/baselines/B002
          scan_one B003 benchmark/baselines/B003
          scan_one B004 benchmark/baselines/B004
          scan_one B005 benchmark/baselines/B005

          scan_one NC001_COMMENT_ONLY benchmark/negative_controls/NC001_COMMENT_ONLY
          scan_one NC002_SEQUENCE_STYLE benchmark/negative_controls/NC002_SEQUENCE_STYLE
          scan_one NC003_QUOTE_STYLE benchmark/negative_controls/NC003_QUOTE_STYLE
          scan_one NC004_EVENT_KEY_ORDER benchmark/negative_controls/NC004_EVENT_KEY_ORDER
          scan_one NC005_EXPLICIT_SUCCESS benchmark/negative_controls/NC005_EXPLICIT_SUCCESS

      - name: Compare normalized scanner findings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_scanner_findings.py

      - name: Record run metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${{ github.repository }}"
            echo "source_commit=${{ github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "actionlint=$(actionlint -version 2>&1)"
            echo "zizmor=$(zizmor --version 2>&1)"
            echo "poutine=$(poutine version 2>&1)"
            echo "negative_control_count=5"
            echo "pair_tool_comparisons=15"
          } > results/run-metadata.txt

          find benchmark/negative_controls results scripts \
            -type f -print |
            sort > results/FILELIST.txt

      - name: Upload RQ6 validation results
        uses: actions/upload-artifact@v6
        with:
          name: rq6-semantics-preserving-control-results
          path: |
            benchmark/negative_controls/
            benchmark/negative_control_manifest.csv
            benchmark/negative_control_manifest.json
            results/
            scripts/
          if-no-files-found: error
          retention-days: 30
