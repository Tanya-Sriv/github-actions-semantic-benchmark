name: H002
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - if: false
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
