name: H006
on: workflow_dispatch
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/linux/
  windows:
    runs-on: windows-latest
    steps:
      - if: false
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/windows/
  verify:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
