name: H008
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo test
  verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
