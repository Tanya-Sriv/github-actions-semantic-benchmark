name: H009
on: workflow_dispatch
jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/primary/
  optional:
    runs-on: ubuntu-latest
    steps:
      - if: false
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/optional/
  verify:
    needs: [primary, optional]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
