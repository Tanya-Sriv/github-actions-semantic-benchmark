name: k011
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo x > x.txt
      - uses: actions/upload-artifact@v4
        with: {name: package, path: x.txt}
  gate:
    needs: build
    runs-on: ubuntu-latest
    steps: [{run: echo gate}]
  verify:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: package}
