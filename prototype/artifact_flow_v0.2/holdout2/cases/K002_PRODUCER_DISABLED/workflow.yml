name: k002
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo x > x.txt
      - if: false
        uses: actions/upload-artifact@v4
        with: {name: package, path: x.txt}
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: package}
