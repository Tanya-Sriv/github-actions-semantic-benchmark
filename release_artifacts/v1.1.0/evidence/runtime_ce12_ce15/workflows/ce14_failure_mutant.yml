name: CE14 failure propagation mutant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - id: run-tests
        name: Run deterministic failure probe
        run: python -m pytest -q runtime_probes/CE14/test_forced_failure.py
  summarize:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record upstream conclusion
        run: echo "test conclusion=${{ needs.test.result }}"
