name: CE12 matrix mutant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python:
          - "3.11"
          - "3.12"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Record matrix cell
        run: echo "CE12 mutant os=${{ matrix.os }} python=${{ matrix.python }}"
